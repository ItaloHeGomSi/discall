<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>discall</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.js"></script>
<style>
  :root {
    --azul:      #00AFF0;
    --azul-esc:  #0078D4;
    --fundo:     #1B1B1F;
    --sup:       #2A2A2E;
    --sup-2:     #37373C;
    --sup-3:     #45454B;
    --texto:     #FFFFFF;
    --texto-dim: #ADADB2;
    --linha:     #3A3A40;
    --perigo:    #C4314B;
    --perigo-fc: #D94A61;
    --fonte: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 20px;
    background: var(--fundo);
    color: var(--texto); font-family: var(--fonte);
    display: flex; align-items: center; justify-content: center;
  }
  .app {
    width: 100%; max-width: 400px;
    background: var(--sup); border-radius: 12px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    transition: max-width 220ms ease;
  }
  .app.emCall { max-width: 680px; }

  /* ——— cabeçalho ——— */
  .topo { padding: 20px 24px 16px; }
  .topo h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .topo p { margin: 6px 0 0; font-size: 14px; color: var(--texto-dim); line-height: 1.5; }

  .corpo { padding: 4px 24px 24px; }

  /* ——— formulários ——— */
  label { display: block; font-size: 13px; font-weight: 600; color: var(--texto-dim); margin-bottom: 6px; }
  input {
    width: 100%; background: var(--sup-2); border: 1px solid transparent; border-radius: 6px;
    color: var(--texto); font-family: inherit; font-size: 15px; padding: 11px 12px;
  }
  input::placeholder { color: #74747A; }
  input:focus { border-color: var(--azul); outline: none; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  .campo { margin-bottom: 14px; }
  .linha-dupla { display: flex; gap: 8px; }
  .linha-dupla input { flex: 1; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 600; }

  button { font-family: inherit; cursor: pointer; border: none; }
  .btn {
    background: var(--sup-2); color: var(--texto); border-radius: 6px;
    font-size: 14px; font-weight: 600; padding: 11px 16px;
  }
  .btn:hover:not(:disabled) { background: var(--sup-3); }
  .btn-azul { width: 100%; background: var(--azul); color: #06232E; padding: 12px; }
  .btn-azul:hover:not(:disabled) { background: #2CC0F5; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-texto {
    background: none; color: var(--azul); font-size: 13px; font-weight: 600; padding: 0;
  }
  .btn-texto:hover:not(:disabled) { text-decoration: underline; }

  .abas { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--linha); }
  .abas button {
    flex: 1; background: none; color: var(--texto-dim); font-size: 14px; font-weight: 600;
    padding: 10px 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .abas button[aria-selected="true"] { color: var(--azul); border-bottom-color: var(--azul); }
  .abas button:hover:not(:disabled) { color: var(--texto); }

  .aviso { font-size: 13px; color: var(--texto-dim); margin: 0 0 14px; line-height: 1.5; }
  .aviso.erro { color: var(--perigo-fc); }
  .aviso:empty { display: none; }
  .dica { font-size: 13px; color: var(--texto-dim); margin: 14px 0 0; line-height: 1.5; }
  .rodape {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--linha);
    font-size: 13px; color: var(--texto-dim);
  }

  /* ——— tela da call ——— */
  .call-topo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--linha);
  }
  .call-titulo { font-size: 17px; font-weight: 600; margin: 0; }
  .call-sub { font-size: 13px; color: var(--texto-dim); margin: 3px 0 0; }
  .cronometro {
    font-size: 14px; font-variant-numeric: tabular-nums; color: var(--texto-dim);
    background: var(--sup-2); padding: 5px 12px; border-radius: 999px;
  }

  .palco {
    padding: 24px; min-height: 240px;
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    align-content: center;
  }

  .pessoa {
    background: var(--sup-2); border-radius: 10px; padding: 20px 12px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    border: 1px solid transparent;
  }
  .pessoa.falando { border-color: var(--azul); }

  .avatar-wrap { position: relative; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 600; color: #fff; letter-spacing: 0.02em;
    box-shadow: 0 0 0 0 rgba(0,175,240,0);
    transition: box-shadow 140ms ease;
  }
  .pessoa.falando .avatar { box-shadow: 0 0 0 4px rgba(0,175,240,0.55); }

  .selo {
    position: absolute; right: -2px; bottom: -2px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--perigo); border: 2.5px solid var(--sup-2);
    display: none; align-items: center; justify-content: center;
  }
  .pessoa.mudo .selo { display: flex; }
  .selo svg { width: 12px; height: 12px; }

  .pessoa .nome {
    font-size: 14px; font-weight: 600; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pessoa .papel { font-size: 12px; color: var(--texto-dim); margin-top: -6px; }

  .barra {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 18px 24px 24px; border-top: 1px solid var(--linha);
  }
  .ctrl {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--sup-2); color: var(--texto);
    display: flex; align-items: center; justify-content: center;
    transition: background 120ms ease;
  }
  .ctrl:hover:not(:disabled) { background: var(--sup-3); }
  .ctrl.ativo { background: var(--texto); color: var(--fundo); }
  .ctrl svg { width: 22px; height: 22px; }
  .desligar {
    width: 68px; background: var(--perigo); color: #fff; border-radius: 26px; margin-left: 10px;
  }
  .desligar:hover { background: var(--perigo-fc); }

  .banner {
    margin: 0 24px 4px; padding: 12px 16px; border-radius: 8px;
    background: var(--azul-esc); color: #fff; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .banner button { background: #fff; color: var(--azul-esc); border-radius: 6px; padding: 7px 14px; font-size: 13px; font-weight: 600; }

  .oculto { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .avatar, .app, .ctrl { transition: none; } }
  @media (max-width: 520px) {
    .palco { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); padding: 18px; }
    .desligar { width: 60px; }
  }
</style>
</head>
<body>

<main class="app" id="app">

  <!-- ——— tela 1: conta ——— -->
  <div id="telaConta">
    <div class="topo">
      <h1>discall</h1>
      <p>Entre para conversar por voz com outras pessoas.</p>
    </div>
    <div class="corpo">
      <div class="abas" role="tablist">
        <button role="tab" id="abaEntrar" aria-selected="true">Entrar</button>
        <button role="tab" id="abaCriar" aria-selected="false">Criar conta</button>
      </div>
      <div class="campo oculto" id="campoNome">
        <label for="nome">Nome de exibição</label>
        <input id="nome" maxlength="18" placeholder="Como quer aparecer na call" autocomplete="nickname">
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="voce@exemplo.com" autocomplete="email">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password">
      </div>
      <p class="aviso" id="statusConta"></p>
      <button class="btn btn-azul" id="btnConta">Entrar</button>
      <p class="dica"><button class="btn-texto" id="btnEsqueci">Esqueci minha senha</button></p>
    </div>
  </div>

  <!-- ——— tela 2: escolher sala ——— -->
  <div id="telaLobby" class="oculto">
    <div class="topo">
      <h1>Entrar numa call</h1>
      <p>Digite um código para criar ou entrar numa conversa.</p>
    </div>
    <div class="corpo">
      <div class="campo">
        <label for="sala">Código da sala</label>
        <div class="linha-dupla">
          <input id="sala" maxlength="4" placeholder="XKPT" autocomplete="off">
          <button class="btn" id="btnSortear">Sortear</button>
        </div>
      </div>
      <p class="aviso" id="statusLobby"></p>
      <button class="btn btn-azul" id="btnEntrarSala">Entrar na call</button>
      <p class="dica">Quem digitar o mesmo código cai na mesma conversa.</p>
      <div class="rodape">
        <span id="quemLogado">—</span>
        <button class="btn-texto" id="btnSairConta">Sair da conta</button>
      </div>
    </div>
  </div>

  <!-- ——— tela 3: em call ——— -->
  <div id="telaSala" class="oculto">
    <div class="call-topo">
      <div>
        <p class="call-titulo" id="callTitulo">Sala</p>
        <p class="call-sub" id="callSub">Conectando…</p>
      </div>
      <span class="cronometro" id="cronometro">00:00</span>
    </div>

    <div class="banner oculto" id="bannerAudio">
      <span>O navegador bloqueou o som.</span>
      <button id="btnLiberarAudio">Tocar áudio</button>
    </div>

    <div class="palco" id="palco"></div>

    <div class="barra">
      <button class="ctrl" id="btnMudo" aria-label="Silenciar microfone" title="Silenciar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>
        </svg>
      </button>
      <button class="ctrl desligar" id="btnSair" aria-label="Sair da call" title="Sair da call">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 9c-1.6 0-3.15.25-4.6.7v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.98.98 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .27-.11.52-.29.7l-2.48 2.46c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
        </svg>
      </button>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile, sendPasswordResetEmail
} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';

// ————— configuração —————
const firebaseConfig = {
  apiKey: "AIzaSyCoQ15L0qhRsYFJeXeJuNxIrqCuTATuTzQ",
  authDomain: "discall-4897e.firebaseapp.com",
  projectId: "discall-4897e",
  appId: "1:71573939539:web:9ad6686a4ee67d2d12eda6"
};

const TOKEN_ENDPOINT = 'https://token.italohegomsi.workers.dev';

const auth = getAuth(initializeApp(firebaseConfig));
const LK = window.LivekitClient;
const $ = id => document.getElementById(id);

let room = null;
let mudo = false;
let modo = 'entrar';
let inicioCall = 0;
let relogio = null;

// ————— utilidades —————
function aviso(el, texto, erro) {
  $(el).textContent = texto || '';
  $(el).className = 'aviso' + (erro ? ' erro' : '');
}

function tela(qual) {
  ['telaConta', 'telaLobby', 'telaSala'].forEach(t => $(t).classList.toggle('oculto', t !== qual));
  $('app').classList.toggle('emCall', qual === 'telaSala');
}

function sortear() {
  const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let c = '';
  for (let i = 0; i < 4; i++) c += letras[Math.floor(Math.random() * letras.length)];
  return c;
}

function traduzir(codigo) {
  const mapa = {
    'auth/invalid-email': 'Esse e-mail não parece válido.',
    'auth/missing-password': 'Digite sua senha.',
    'auth/weak-password': 'A senha precisa de pelo menos 6 caracteres.',
    'auth/email-already-in-use': 'Já existe uma conta com esse e-mail. Use a aba Entrar.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/user-not-found': 'Não encontramos uma conta com esse e-mail.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/too-many-requests': 'Muitas tentativas. Espere alguns minutos.',
    'auth/network-request-failed': 'Sem conexão com o servidor.'
  };
  return mapa[codigo] || 'Não foi possível concluir. Tente de novo.';
}

// Iniciais e cor fixa por pessoa: o mesmo usuário sempre tem o mesmo avatar.
function iniciais(nome) {
  const partes = nome.trim().split(/\s+/).slice(0, 2);
  return partes.map(p => p[0]).join('').toUpperCase() || '?';
}

const CORES = ['#0078D4', '#8764B8', '#C239B3', '#CA5010', '#0B6A0B', '#00838F'];
function corDe(chave) {
  let soma = 0;
  for (let i = 0; i < chave.length; i++) soma = (soma * 31 + chave.charCodeAt(i)) >>> 0;
  return CORES[soma % CORES.length];
}

// ————— conta —————
function trocarModo(novo) {
  modo = novo;
  $('abaEntrar').setAttribute('aria-selected', novo === 'entrar');
  $('abaCriar').setAttribute('aria-selected', novo === 'criar');
  $('campoNome').classList.toggle('oculto', novo === 'entrar');
  $('btnConta').textContent = novo === 'entrar' ? 'Entrar' : 'Criar conta';
  $('btnEsqueci').classList.toggle('oculto', novo === 'criar');
  $('senha').setAttribute('autocomplete', novo === 'entrar' ? 'current-password' : 'new-password');
  aviso('statusConta', '');
}

async function enviarConta() {
  const email = $('email').value.trim();
  const senha = $('senha').value;
  const nome = $('nome').value.trim();
  if (modo === 'criar' && !nome) return aviso('statusConta', 'Escolha um nome de exibição.', true);

  $('btnConta').disabled = true;
  aviso('statusConta', modo === 'entrar' ? 'Entrando…' : 'Criando conta…');
  try {
    if (modo === 'entrar') {
      await signInWithEmailAndPassword(auth, email, senha);
    } else {
      const cred = await createUserWithEmailAndPassword(auth, email, senha);
      await updateProfile(cred.user, { displayName: nome });
      await cred.user.getIdToken(true);
    }
  } catch (e) {
    aviso('statusConta', traduzir(e.code), true);
  } finally {
    $('btnConta').disabled = false;
  }
}

async function recuperarSenha() {
  const email = $('email').value.trim();
  if (!email) return aviso('statusConta', 'Digite seu e-mail primeiro.', true);
  try {
    await sendPasswordResetEmail(auth, email);
    aviso('statusConta', 'Link de recuperação enviado. Confira seu e-mail.');
  } catch (e) {
    aviso('statusConta', traduzir(e.code), true);
  }
}

onAuthStateChanged(auth, user => {
  if (user) {
    $('quemLogado').textContent = user.displayName || user.email;
    $('senha').value = '';
    if (!room) tela('telaLobby');
  } else {
    tela('telaConta');
  }
});

// ————— sala —————
function pintarPalco() {
  const palco = $('palco');
  palco.innerHTML = '';
  const todos = [room.localParticipant, ...room.remoteParticipants.values()];

  todos.forEach(p => {
    const eu = p === room.localParticipant;
    const silenciado = eu ? mudo : !p.isMicrophoneEnabled;
    const nome = p.name || p.identity;

    const card = document.createElement('div');
    card.className = 'pessoa' + (p.isSpeaking && !silenciado ? ' falando' : '') + (silenciado ? ' mudo' : '');
    card.innerHTML =
      '<div class="avatar-wrap">' +
        '<div class="avatar"></div>' +
        '<span class="selo">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">' +
            '<path d="M4 4l16 16"/><path d="M12 3a3 3 0 0 1 3 3v4"/><path d="M9 9v3a3 3 0 0 0 4.5 2.6"/>' +
            '<path d="M18 11a6 6 0 0 1-8.7 5.4M6 11a6 6 0 0 0 6 6v4"/>' +
          '</svg>' +
        '</span>' +
      '</div>' +
      '<span class="nome"></span>' +
      '<span class="papel"></span>';

    const av = card.querySelector('.avatar');
    av.textContent = iniciais(nome);
    av.style.background = corDe(p.identity);
    card.querySelector('.nome').textContent = nome;
    card.querySelector('.papel').textContent = eu ? 'Você' : (silenciado ? 'Sem som' : '');
    palco.appendChild(card);
  });

  $('callSub').textContent = todos.length === 1
    ? 'Aguardando outras pessoas'
    : todos.length + ' pessoas na chamada';
}

function iniciarRelogio() {
  inicioCall = Date.now();
  clearInterval(relogio);
  relogio = setInterval(() => {
    const s = Math.floor((Date.now() - inicioCall) / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    $('cronometro').textContent = mm + ':' + ss;
  }, 1000);
}

async function entrarSala() {
  const sala = ($('sala').value.trim() || sortear()).toUpperCase();
  if (!/^[A-Z]{4}$/.test(sala)) return aviso('statusLobby', 'O código tem 4 letras.', true);

  $('btnEntrarSala').disabled = true;
  aviso('statusLobby', 'Pedindo autorização…');

  let dados;
  try {
    const idToken = await auth.currentUser.getIdToken();
    const resp = await fetch(TOKEN_ENDPOINT + '?sala=' + encodeURIComponent(sala), {
      headers: { Authorization: 'Bearer ' + idToken }
    });
    if (!resp.ok) {
      const corpo = await resp.json().catch(() => ({}));
      throw new Error(corpo.erro || ('erro ' + resp.status));
    }
    dados = await resp.json();
  } catch (e) {
    $('btnEntrarSala').disabled = false;
    return aviso('statusLobby', 'Não consegui autorização: ' + e.message, true);
  }

  tela('telaSala');
  $('callTitulo').textContent = 'Sala ' + sala;
  $('callSub').textContent = 'Conectando…';
  $('cronometro').textContent = '00:00';

  room = new LK.Room({
    adaptiveStream: true,
    dynacast: true,
    audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });

  room
    .on(LK.RoomEvent.ParticipantConnected, pintarPalco)
    .on(LK.RoomEvent.ParticipantDisconnected, pintarPalco)
    .on(LK.RoomEvent.TrackMuted, pintarPalco)
    .on(LK.RoomEvent.TrackUnmuted, pintarPalco)
    .on(LK.RoomEvent.ActiveSpeakersChanged, pintarPalco)
    .on(LK.RoomEvent.TrackSubscribed, track => {
      if (track.kind === LK.Track.Kind.Audio) {
        const el = track.attach();
        el.dataset.lk = '1';
        document.body.appendChild(el);
      }
    })
    .on(LK.RoomEvent.TrackUnsubscribed, track => track.detach().forEach(el => el.remove()))
    .on(LK.RoomEvent.AudioPlaybackStatusChanged, () => {
      $('bannerAudio').classList.toggle('oculto', room.canPlaybackAudio);
    })
    .on(LK.RoomEvent.Disconnected, () => { $('callSub').textContent = 'Chamada encerrada'; clearInterval(relogio); });

  try {
    await room.connect(dados.url, dados.token);
    await room.localParticipant.setMicrophoneEnabled(true);
    iniciarRelogio();
    pintarPalco();
  } catch (e) {
    $('callSub').textContent = 'Falha ao conectar: ' + e.message;
  }
  $('btnEntrarSala').disabled = false;
}

function sairSala() {
  if (room) room.disconnect();
  document.querySelectorAll('audio[data-lk]').forEach(el => el.remove());
  clearInterval(relogio);
  room = null;
  mudo = false;
  $('btnMudo').classList.remove('ativo');
  $('palco').innerHTML = '';
  $('bannerAudio').classList.add('oculto');
  aviso('statusLobby', '');
  tela('telaLobby');
}

// ————— eventos —————
$('abaEntrar').addEventListener('click', () => trocarModo('entrar'));
$('abaCriar').addEventListener('click', () => trocarModo('criar'));
$('btnConta').addEventListener('click', enviarConta);
$('btnEsqueci').addEventListener('click', recuperarSenha);
$('senha').addEventListener('keydown', e => { if (e.key === 'Enter') enviarConta(); });

$('btnSortear').addEventListener('click', () => { $('sala').value = sortear(); });
$('btnEntrarSala').addEventListener('click', entrarSala);
$('sala').addEventListener('keydown', e => { if (e.key === 'Enter') entrarSala(); });
$('btnSairConta').addEventListener('click', () => signOut(auth));

$('btnSair').addEventListener('click', sairSala);
$('btnLiberarAudio').addEventListener('click', async () => {
  await room.startAudio();
  $('bannerAudio').classList.add('oculto');
});
$('btnMudo').addEventListener('click', async () => {
  mudo = !mudo;
  await room.localParticipant.setMicrophoneEnabled(!mudo);
  $('btnMudo').classList.toggle('ativo', mudo);
  $('btnMudo').setAttribute('aria-label', mudo ? 'Reativar microfone' : 'Silenciar microfone');
  $('btnMudo').title = mudo ? 'Reativar' : 'Silenciar';
  pintarPalco();
});

$('sala').value = sortear();
</script>
